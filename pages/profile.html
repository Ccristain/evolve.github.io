<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Profile</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/pages_css/profile.css" />
    <link rel="stylesheet" href="../css/pages_css/global_modal.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alice&family=Anton&family=Baloo+2:wght@400..800&family=Bebas+Neue&family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend:wght@100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div id="header-icon-wrapper">
        <button
          id="profile-wrapper"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="hamburgerMenu"
        >
          <img
            src="../assets/evolv_logo.png"
            alt="User profile"
            id="profile-image"
          />
          <figcaption id="profile-name">Guest 12331</figcaption>
        </button>

        <section id="hamburgerMenu" class="drop-down-menu" hidden>
          <a href="profile.html"
            ><img
              src="../assets/icons/contact-dark.svg"
              class="icon"
              alt=""
            />Profile</a
          >
          <a href="authentication.html"
            ><img
              src="../assets/icons/contact-dark.svg"
              class="icon"
              alt=""
            />Log-in</a
          >
        </section>
      </div>
    </header>
    <aside
      id="collapsible"
      aria-expanded="false"
      aria-controls="toggle-sidebar"
      aria-label="Collapse sidebar"
    >
      <img src="../assets/evolv_logo.png" alt="Evolv" id="dashboardLogo" />
      <div id="aside-btn-wrapper">
        <button class="action-button" id="toggle-sidebar">
          <img src="../assets/icons/arrow-right-dark.svg" class="icon" alt="" />
        </button>
        <button class="action-button aside-button">
          <img
            src="../assets/icons/circle-question-mark-dark.svg"
            class="icon"
            alt=""
          />
        </button>
        <button class="action-button aside-button">
          <img src="../assets/icons/book-alert-dark.svg" class="icon" alt="" />
        </button>
        <button
          class="action-button aside-button contact-button"
          aria-label="Contact us"
        >
          <img src="../assets/icons/contact-dark.svg" class="icon" alt="" />
        </button>
      </div>
    </aside>
    <main>
      <article id="profile-container">
        <h1 class="title">Profile</h1>
        <section class="profile-section">
          <h2>Personal</h2>
        </section>
        <section class="profile-section">
          <h2>Privacy</h2>
        </section>
        <section class="profile-section">
          <h2>Theme</h2>
        </section>
        <section class="profile-section">
          <h2>Data</h2>
        </section>
      </article>
    </main>

    <script src="../js/global_tool.js" defer></script>
    <script src="../js/pages_js/profile.js" defer></script>
    <script src="../js/global.js" defer></script>
  </body>
</html>
