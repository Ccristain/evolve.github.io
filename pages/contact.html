<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contact Evolv</title>
    <meta name="description" content="Get in touch with Evolv." />

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/pages_css/contact.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alice&family=Anton&family=Baloo+2:wght@400..800&family=Bebas+Neue&family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend:wght@100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="parent-container">
      <header class="primary-header">
        <figure id="logo-wrapper">
          <a href="../index.html">
            <img src="../assets/logo_evolv_light.png" alt="Evolv home" />
          </a>
        </figure>
        <nav id="navlinks">
          <a href="../index.html">HOME</a>
          <a href="../index.html#tutorial">HOW TO USE</a>
          <a href="../pages/about.html">ABOUT</a>
          <a href="contact.html">CONTACT US</a>
        </nav>
      </header>
      <main>
        <section id="main-content-wrapper">
          <div id="form-wrapper">
            <form method="post" id="contact-form">
              <h1>Start a Conversation</h1>

              <label for="name"
                ><span>Name:</span>
                <input type="text" id="name" placeholder="Ex: Jacob" required
              /></label>
              <label for="email"
                ><span>Email:</span>
                <input
                  type="email"
                  id="email"
                  placeholder="Ex: example@gmail.com"
                  required
              /></label>
              <label for="subject"
                ><span>Subject:</span>
                <select name="subject" id="subject">
                  <option value="collaboration" selected>Collaboration</option>
                  <option value="bug report">Bug Report</option>
                  <option value="personal">Personal</option>
                  <option value="account">My Account</option>
                </select></label
              >
              <label for="message"
                ><span>Message:</span>
                <textarea
                  id="message"
                  placeholder="Write something..."
                  maxlength="1000"
                  required
                ></textarea>
              </label>
              <button type="submit" id="submit-btn" class="action-button">
                Submit
              </button>
            </form>
          </div>

          <figure id="contact-image">
            <img src="../assets/img/spidey.avif" alt="climbing-spider" />
          </figure>
        </section>
      </main>
      <footer>
        <div class="footer-child">
          <a href="../pages/about.html">About Us</a>
          <a href="#">Address</a>
          <a href="#">Cookie Settings</a>
        </div>
        <div class="footer-child">
          <img src="../assets/evolv_logo.png" alt="Evolv" />
        </div>
        <div class="footer-child">
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Service</a>
          <a href="contact.html">Help</a>
        </div>
        <p id="right-reserve">© 2026 Evolv. All rights reserved.</p>
      </footer>
    </div>

    <script src="../js/global.js" defer></script>
    <script src="../js/pages_js/contact.js" defer></script>
  </body>
</html>
