<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login and Signup</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/pages_css/gallery.css" />
    <link rel="stylesheet" href="../css/pages_css/global_modal.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alice&family=Anton&family=Baloo+2:wght@400..800&family=Bebas+Neue&family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend:wght@100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <div id="search-wrapper">
        <label for="search-bar"
          ><img src="../assets/icons/search-icon.svg"
        /></label>
        <input type="search" name="search-bar" id="search-bar" />
      </div>
      <div id="header-icon-wrapper">
        <button
          id="profile-wrapper"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="hamburgerMenu"
        >
          <img
            src="../assets/evolv_logo.png"
            alt="user-profile"
            id="profile-image"
          />
          <figcaption id="profile-name">Guest 12331</figcaption>
        </button>
        <button id="settings-wrapper">
          <img src="../assets/icons/bolt.svg" alt="settings" />
        </button>
        <section id="hamburgerMenu" class="drop-down-menu" hidden>
          <a href="#"
            ><img
              src="../assets/icons/contact-dark.svg"
              class="icon"
            />Profile</a
          >
          <a href="#"
            ><img
              src="../assets/icons/contact-dark.svg"
              class="icon"
            />Log-in</a
          >
        </section>
      </div>
    </header>
    <aside
      id="collapsible"
      aria-expanded="false"
      aria-controls="toggle-sidebar"
      aria-label="Collapse sidebar"
    >
      <img src="../assets/evolv_logo.png" alt="evolv-logo" id="dashboardLogo" />
      <div id="aside-btn-wrapper">
        <button class="action-button" id="toggle-sidebar">
          <img src="../assets/icons/arrow-right-dark.svg" class="icon" />
        </button>
        <button class="action-button aside-button">
          <img
            src="../assets/icons/circle-question-mark-dark.svg"
            class="icon"
          />
        </button>
        <button class="action-button aside-button">
          <img src="../assets/icons/book-alert-dark.svg" class="icon" />
        </button>
        <button
          class="action-button aside-button contact-button"
          aria-label="Contact us"
        >
          <img src="../assets/icons/contact-dark.svg" class="icon" alt="" />
        </button>
      </div>
    </aside>
    <main id="gallery-wrapper">
      <section id="gallery-folder">
        <section id="title-wrapper">
          <span id="title-divider"
            ><h1 class="title" id="folder-title">Folder Title</h1>
            <button class="action-button" id="export-btn">
              <img
                src="../assets/icons/arrow-right-dark.svg"
                alt="export"
              />Export
            </button></span
          >
          <button id="returnBtn">Return</button>
        </section>
        <div id="items">
          <!--<figure id="item-1" class="item">
            <img
              src="../assets/evolv_logo.png"
              class="item-img"
              alt="item-image"
            />
            <figcaption class="item-cap">Day: 1</figcaption>
          </figure>-->
        </div>
      </section>
      <button id="toolset" class="flex-center">
        <img
          src="../assets/icons/wrench_icon_dark.svg"
          id="toolset-icon"
          class="icon"
        />
      </button>
      <div id="tool-menu">
        <button
          class="tool"
          id="openUploadModal"
          aria-label="Upload"
          data-tooltip="Upload"
        >
          <img src="../assets/icons/plus.svg" class="icon" />
        </button>
      </div>
      <dialog id="create-folder-modal-wrapper">
        <form class="large-modal">
          <button type="button" class="close-modal-btn" id="closeUploadModal">
            <img
              src="../assets/icons/x.svg"
              alt="close-modal-button"
              class="icon"
            />
          </button>
          <div id="camera-upload-input-wrapper">
            <div class="capture-modal">
              <h2 class="title second-title-size">Capture</h2>
              <video id="camera" autoplay muted playsinline></video>
              <canvas id="capture-canvas" style="display: none"></canvas>
              <button type="button" id="capture-btn" class="action-button">
                Capture
              </button>
            </div>
            <p class="capture-divider">or</p>
            <div class="capture-modal">
              <img src="#" id="selectedImageFromFile" />
              <div class="modal-input-wrapper">
                <label for="daily-image-input" class="modal-label"
                  >Upload image:</label
                >
                <input
                  type="file"
                  accept="image/*"
                  name="daily-image-input"
                  id="daily-image-input"
                  class="input-design"
                />
              </div>
              <button type="button" class="action-button" id="upload-btn">
                Upload
              </button>
            </div>
          </div>
        </form>
      </dialog>
      <dialog id="export-modal">
        <section
          class="small-modal export-child"
          id="export-modal-content-wrapper"
        >
          <canvas id="export-canvas"></canvas>

          <label for="timelapse-speed">Select Timelapse Speed</label>
          <p id="speed-number"></p>
          <input
            type="range"
            id="timelapse-speed"
            min="10"
            max="500"
            value="250"
            step="10"
          />
          <button type="button" class="action-button" id="download-timelapse">
            Download
          </button>
          <p id="download-status" role="status" aria-live="polite"></p>
        </section>
        <button type="button" class="close-modal-btn" id="closeExportModal">
          <img
            src="../assets/icons/x.svg"
            alt="close-modal-button"
            class="icon"
          />
        </button>
        <p id="empty-images" hidden>EMPTY FOR TIMELAPSE. UPLOAD FIRST</p>
      </dialog>
    </main>
    <figure id="fullscreen-wrapper">
      <button id="fullscreen-close-btn" class="close-modal-btn">
        <img
          src="../assets/icons/x.svg"
          alt="close-modal-button"
          class="icon"
        />
      </button>
      <img src="../assets/evolv_logo.png" id="fullscreen-img" alt="" />
    </figure>
    <script src="../js/global.js"></script>
    <script src="../js/global_tool.js"></script>
    <script src="../js/pages_js/gallery.js"></script>
  </body>
</html>
