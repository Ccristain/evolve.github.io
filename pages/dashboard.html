<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login and Signup</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/pages_css/dashboard.css" />
    <link rel="stylesheet" href="../css/pages_css/global_modal.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alice&family=Anton&family=Baloo+2:wght@400..800&family=Bebas+Neue&family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend:wght@100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <div id="search-wrapper">
        <label for="search-bar"
          ><img src="../assets/icons/search-icon.svg"
        /></label>
        <input type="search" name="search-bar" id="search-bar" />
      </div>
      <div id="header-icon-wrapper">
        <figure id="profile-wrapper">
          <img
            src="../assets/evolv_logo.png"
            alt="user-profile"
            id="profile-image"
          />
          <figcaption id="profile-name">Guest 12331</figcaption>
        </figure>
        <button id="settings-wrapper">
          <img src="../assets/icons/bolt.svg" alt="settings" />
        </button>
      </div>
    </header>
    <aside>
      <img src="../assets/evolv_logo.png" alt="evolv-logo" />
      <div id="aside-btn-wrapper">
        <input type="checkbox" id="collapsible" class="action-button" />
        <button class="action-button aside-button">
          <img
            src="../assets/icons/layout-dashboard-dark.svg"
            class="icon"
          />Dashboard
        </button>
        <button class="action-button aside-button">
          <img
            src="../assets/icons/circle-question-mark-dark.svg"
            class="icon"
          />How to Use
        </button>
        <button class="action-button aside-button">
          <img src="../assets/icons/book-alert-dark.svg" class="icon" />Update
        </button>
        <button class="action-button aside-button">
          <img src="../assets/icons/contact-dark.svg" class="icon" />Contact Us
        </button>
      </div>
    </aside>
    <main id="gallery-wrapper">
      <section id="gallery-folder">
        <h1 class="title">Collections</h1>
        <div id="folders"></div>
      </section>
      <button id="toolset" class="flex-center">
        <img
          src="../assets/icons/wrench_icon_dark.svg"
          id="toolset-icon"
          class="icon"
        />
      </button>
      <div id="tool-menu">
        <button class="tool" onclick="openModal()">
          <img src="../assets/icons/plus.svg" class="icon" />
        </button>
      </div>
      <article id="create-folder-modal-wrapper">
        <form id="create-folder-modal">
          <button id="close-modal-btn" onclick="closeModal()">
            <img
              src="../assets/icons/x.svg"
              alt="close-modal-button"
              class="icon"
            />
          </button>
          <h2 class="title second-title-size">Create New Folder</h2>
          <div class="modal-input-wrapper">
            <label for="create-title-input" class="modal-label">Title:</label>
            <input
              type="text"
              name="create-title-input"
              id="create-title-input"
            />
          </div>
          <button type="button" class="action-button" onclick="createFolder()">
            Create
          </button>
        </form>
      </article>
    </main>
    <script src="../js/global_tool.js"></script>
    <script src="../js/pages_js/dashboard.js"></script>
  </body>
</html>
